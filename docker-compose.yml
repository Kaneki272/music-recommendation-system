# ==============================================================================
# DEPLOYMENT DEFINITION
# ==============================================================================
# NOTE: This docker-compose.yml defines the full-stack deployment (API + Frontend + DBs).
# If you are developing locally, the parent directory's docker-compose.yml is typically
# used as the canonical infrastructure runtime for databases to preserve persistent volumes.
# This file is useful for spinning up the entire stack from scratch or for deployment.
# ==============================================================================

services:
  # ---------------------------------------------------------
  # BACKEND & FRONTEND
  # ---------------------------------------------------------
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: recsys-api:latest
    container_name: recsys-api
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URI=postgresql://user:password@postgres:5432/recsys
      - MONGO_URI=mongodb://user:password@mongo:27017/
      - REDIS_URI=redis://redis:6379/0
      - QDRANT_URI=http://qdrant:6333
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - recsys_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: recsys-frontend:latest
    container_name: recsys-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - recsys_network

  # ---------------------------------------------------------
  # DATABASES & CACHE
  # ---------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: recsys-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: recsys
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d recsys"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - recsys_network

  mongo:
    image: mongo:6
    container_name: recsys-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - recsys_network

  redis:
    image: redis:7-alpine
    container_name: recsys-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - recsys_network

  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: recsys-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - recsys_network

  # ---------------------------------------------------------
  # EVENT STREAMING
  # ---------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: recsys-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - recsys_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: recsys-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - recsys_network

networks:
  recsys_network:
    driver: bridge

volumes:
  postgres_data:
    name: music_recsys_postgres_data
  mongo_data:
    name: music_recsys_mongo_data
  redis_data:
    name: music_recsys_redis_data
  qdrant_data:
    name: music_recsys_qdrant_data
